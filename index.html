    .la{
        position: absolute;
        left: 330px; 
        top: 10px;
        display: inline-block;
        transform-origin: bottom center;
        animation: rungla 3s ease-in-out infinite;
         
    }
    @keyframes rungla {

        0% { transform: rotate(-4deg);}

        
        
        50%{
            transform: rotate(4deg);
        }
        
        100%{
            transform: rotate(-4deg);
        }
            
            
        }

            
        .la1{
            position: absolute;
            top: 48px;
            left: 280px;

            animation-duration: 2s;
        }
        

        
        .la2{
            position: absolute;
            top: 30px;
            left: 240px;
            animation-duration: 2.5s;
        }

    
        .la3{
            position: absolute;
            top: 0px;
            left: 170px;
            animation-duration: 3s;
        }

    
        .la4{
            position: absolute;
            top: 5px;
            left: 160px;
            animation-duration: 3.5s ;
        }

        .cay{
            position: relative;
            width: 500px;
            margin: 120px auto 0;

           
            
        }
        .la img{
            width: 70px;
            display: block;
            position: absolute;
            top: 56pt;
            left: 355px;
            

        }
        .video{

            width: fit-content;
    margin: 20px auto 25px;

        }

        .cobui {
    position: absolute;

}
.hoabui {

}

.tieude {
    text-align: center;
    font-size: 30px;
    color: #176b3a;
    margin-top: 20px;
    margin-bottom: 15px;
    text-shadow:
        0 0 6px #ffffff,

}

        .chantrang {
    text-align: center;
    margin-top: 30px;
    padding: 15px;
    font-size: 16px;
    color: #ffffff;
    text-shadow:
        0 0 5px #176b3a,
        0 0 10px #176b3a;
}
/* Đàn chim bay trên bầu trời */
.dan-chim {
    position: absolute;
    top: 100px;
    left: -100px;
    width: 100%;
    height: 100px;
    pointer-events: none;
    z-index: 10;
}

.chim {
    position: absolute;
    display: inline-block;
    font-size: 25px;
    scale: -1 1;
    animation: chimBay 12s linear infinite;
    will-change: transform;
}

.chim1 {
    top: 10px;
    animation-delay: 0s;
}

.chim2 {
    top: 30px;
    animation-delay: 1s;
}

.chim3 {
    top: 0;
    animation-delay: 2s;
}

.chim4 {
    top: 45px;
    animation-delay: 3s;
}

.chim5 {
    top: 20px;
    animation-delay: 4s;
}

@keyframes chimBay {
    0% {
        left: 0;
        transform: translateY(0);
    }

    25% {
        transform: translateY(-15px);
    }

    50% {
        transform: translateY(0);
    }

    75% {
        transform: translateY(-15px);
    }

    100% {
        left: calc(100vw - 50px);
        transform: translateY(0);
    }
}

    
</style>
